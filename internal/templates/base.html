{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин стройматериалов</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }
  nav { background: #1a1a2e; color: #fff; display: flex; align-items: center; gap: 0; padding: 0 24px; height: 56px; }
  nav .logo { font-size: 18px; font-weight: 700; color: #e0e0ff; margin-right: 32px; white-space: nowrap; }
  nav a { color: #c0c0e0; text-decoration: none; padding: 16px 16px; display: block; font-size: 14px; transition: background .15s, color .15s; }
  nav a:hover, nav a.active { background: #16213e; color: #fff; }
  main { max-width: 1200px; margin: 32px auto; padding: 0 16px; }
  h2 { font-size: 22px; font-weight: 700; margin-bottom: 20px; color: #1a1a2e; }
  h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #333; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); padding: 24px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #f5f6fa; color: #555; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 2px solid #e0e0e0; }
  td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fafbff; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-green { background: #d4f4e2; color: #1a7a3a; }
  .badge-blue  { background: #d4e8ff; color: #1a4a8a; }
  .badge-gray  { background: #ececec; color: #555; }
  .badge-red   { background: #fde8e8; color: #a11; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  label { font-size: 13px; color: #555; margin-bottom: 3px; display: block; }
  input, select, textarea { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%; background: #fafafa; }
  input:focus, select:focus { outline: none; border-color: #4a6cf7; background: #fff; }
  .field { display: flex; flex-direction: column; min-width: 150px; flex: 1; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
  .btn-primary { background: #4a6cf7; color: #fff; }
  .btn-danger  { background: #e74c3c; color: #fff; }
  .btn-warning { background: #f39c12; color: #fff; }
  .btn-sm { padding: 4px 12px; font-size: 13px; }
  .btn:hover { opacity: .85; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .stat-box { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); padding: 20px 24px; }
  .stat-val { font-size: 36px; font-weight: 800; color: #4a6cf7; }
  .stat-lbl { font-size: 13px; color: #888; margin-top: 4px; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
  .modal-bg.open { display:flex; }
  .modal { background:#fff; border-radius:12px; padding:28px; min-width:340px; max-width:560px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.18); }
  .modal h3 { margin-bottom:16px; }
  .close-btn { float:right; cursor:pointer; font-size:20px; color:#999; background:none; border:none; }
  @media(max-width:700px){ .grid2{grid-template-columns:1fr;} form{flex-direction:column;} }
</style>
</head>
<body>
<nav>
  <span class="logo">🏗 СтройМаг</span>
  <a href="/customers"  {{if eq .Active "customers"}}class="active"{{end}}>👥 Клиенты</a>
  <a href="/categories" {{if eq .Active "categories"}}class="active"{{end}}>🗂 Категории</a>
  <a href="/suppliers"  {{if eq .Active "suppliers"}}class="active"{{end}}>🏭 Поставщики</a>
  <a href="/products"   {{if eq .Active "products"}}class="active"{{end}}>📦 Товары</a>
  <a href="/orders"     {{if eq .Active "orders"}}class="active"{{end}}>🛒 Заказы</a>
  <a href="/payments"   {{if eq .Active "payments"}}class="active"{{end}}>💳 Платежи</a>
  <a href="/analytics"  {{if eq .Active "analytics"}}class="active"{{end}}>📊 Аналитика</a>
</nav>
<main>
  {{template "content" .}}
</main>
</body>
</html>
{{end}}
